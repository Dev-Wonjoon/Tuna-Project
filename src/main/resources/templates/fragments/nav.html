<nav th:fragment="nav" class="flex h-full flex-col px-4 py-5">
    <a
            th:href="@{/}"
            class="px-2 text-2xl font-semibold tracking-tight"
    >
        Tuna
    </a>

    <!-- 로그인 버튼 -->
    <div class="mt-8 px-2">
        <a
                th:href="@{/login}"
                class="text-sm font-medium hover:underline"
        >
            로그인
        </a>

        <p class="mt-1 text-xs text-neutral-500">
            회원이 아니신가요?
            <a th:href="@{/signup}" class="hover:underline text-blue-600 font-semibold hover:text-blue-700">
                회원가입
            </a>
        </p>
    </div>

    <!-- 기본 메뉴 -->
    <ul class="mt-8 flex flex-col gap-1">
        <li>
            <a
                    th:href="@{/}"
                    class="
                    flex w-full items-center rounded-md
                    px-3 py-2 text-sm text-neutral-700
                    hover:bg-neutral-100 hover:text-neutral-950
                "
                    th:classappend="${currentMenu == 'home'}
                    ? ' bg-neutral-200 font-medium text-neutral-950'
                    : ''"
            >
                홈
            </a>
        </li>

        <li>
            <a
                    th:href="@{/mypage}"
                    class="
                    flex w-full items-center rounded-md
                    px-3 py-2 text-sm text-neutral-700
                    hover:bg-neutral-100 hover:text-neutral-950
               "
                    th:classappend="${currentMenu == 'mypage'}
               ? ' bg-neutral-200 font-medium text-neutral-950'
               : ''"
            >
                마이 페이지
            </a>
        </li>
    </ul>

    <div class="mt-6 px-2">
        <a
                th:href="@{/posts/new}"
                class="
                flex w-full items-center justify-center gap-2
                rounded-md bg-neutral-900
                px-4 py-2.5
                text-sm font-medium text-white
                hover:bg-neutral-700
                focus-visible:outline-2
                focus-visible:outline-offset-2
                focus-visible:outline-neutral-900
            "
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="lucide lucide-pencil-icon lucide-pencil">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
                <path d="m15 5 4 4"/>
            </svg>

            <span>글 작성</span>
        </a>
    </div>

    <!-- 플레이리스트 -->
    <div class="mt-8 flex items-center justify-between px-2">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-neutral-500">
            플레이리스트
        </h2>

        <a
                th:href="@{/playlists/new}"
                aria-label="새 플레이리스트 만들기"
                title="새 플레이리스트 만들기"
                class="
                    flex size-7 items-center justify-center
                    rounded-md text-neutral-500
                    hover:bg-neutral-100 hover:text-neutral-950
                    focus-visible:outline-2
                    focus-visible:outline-offset-2
                    focus-visible:outline-neutral-900
            "
        >
            <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="size-4"
                    aria-hidden="true"
            >
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
            </svg>
        </a>
    </div>

    <ul class="mt-2 flex flex-col gap-1">
        <li th:each="playlist : ${playlists}">
            <a
                    th:href="@{/playlists/{id}(id=${playlist.id})}"
                    class="
                    flex items-center justify-between gap-3
                    rounded-md px-3 py-2
                    text-sm text-neutral-700
                    hover:bg-neutral-100 hover:text-neutral-950
                "
                    th:classappend="${
                    currentPlaylistId != null
                    and currentPlaylistId == playlist.id
                } ? ' bg-neutral-200 font-medium text-neutral-950' : ''"
            >
                <span
                        class="truncate"
                        th:text="${playlist.name}"
                >
                    플레이리스트
                </span>

                <span
                        class="shrink-0 text-xs text-neutral-400"
                        th:text="${playlist.postCount}"
                >0</span>
            </a>
        </li>

        <li
                th:if="${playlists == null or #lists.isEmpty(playlists)}"
                class="px-3 py-2 text-xs text-neutral-400"
        >
            플레이리스트가 없습니다.
        </li>
    </ul>
</nav>
