<ul th:fragment="nav" class="mt-7 flex flex-col items-start gap-2">
    <li>
        <a
            th:href="@{/}"
            class="text-sm hover:underline"
        >
            홈
        </a>
    </li>

    <li>
       <a
           th:href="@{/mypage}"
           class="text-sm hover:underline"
       >
            마이페이지
       </a>
    </li>

    <li class="mt-5 text-xs font-semibold text-neutral-500">
        플레이리스트
    </li>

    <li
        th:each="playlist : ${playlists}"
        class="w-full"
    >
        <a
            th:href="@{/playlists/{id}(id=${playlist['id']})}"
            class="
                flex w-full items-center justify-between
                gap-2 rounded px-2 py-1.5
                text-sm text-neutral-700
                hover:bg-neutral-100
            "
        >
            <span
                class="truncate"
                th:text="${playlist['name']}"
            >
                플레이리스트
            </span>
            <span
                class="text-xs text-neutral-400"
                th:text="${playlist['postCount']}"
            >
                0
            </span>
        </a>
    </li>
</ul>
