<th:block
    xmlns:th="https://www.thymeleaf.org"
    th:fragment="commentForm(postId)"
>
    <form
        th:action="@{/posts/{postId}/comments(postId=${postId})}"
        method="POST"
        class="
            mt-4 rounded-lg border border-neutral-300
            bg-white p-4
        "
    >
        <label
            for="comment-content"
            class="sr-only"
        >
            댓글 내용
        </label>

        <textarea
            id="comment-content"
            name="content"
            rows="3"
            maxlength="1000"
            required
            placeholder="댓글을 입력하세요."
            class="
                min-h-24 w-full resize-y
                rounded-md border border-neutral-300
                px-3 py-2 text-sm
                placeholder:text-neutral-400
                focus:border-neutral-900
                focus:outline-none
            "
        ></textarea>
        <div class="mt-3 flex items-center justify-between">
            <span class="text-xs text-neutral-400">
                최대 1000자
            </span>

            <button
                type="submit"
                class="
                    rounded-md bg-neutral-900
                    px-4 py-2 text-sm font-medium text-white
                    hover:bg-neutral-700
                    focus-visible:outline-2
                    focus-visible:outline-offset-2
                    focus-visible:outline-neutral-900
                "
            >
                댓글 작성
            </button>
        </div>
    </form>
</th:block>
