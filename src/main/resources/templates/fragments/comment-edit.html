<th:block
        xmlns:th="https://www.thymeleaf.org"
        th:fragment="commentForm(postId)"
>
    <!-- 댓글 수정 영역 -->
    <form
            th:action="@{/posts/{postId}/comments/{commentId}/edit(postId=${post.id},commentId=${comment.id})}"
            method="POST"
            data-comment-edit-form
            class="
                    hidden rounded-lg border border-neutral-300
                    bg-white p-4
                "
    >
        <input class="hidden" th:name="id" th:value="${comment.id}">
        <textarea
                name="content"
                maxlength="1000"
                required
                th:text="${comment.content}"
                class="
                        min-h-24 w-full resize-y rounded-md
                        border border-neutral-400 p-3 text-sm
                    "
        ></textarea>

        <div class="mt-3 flex items-center justify-between">
                        <span class="text-xs text-neutral-400">
                            최대 1000자
                        </span>

            <button
                    type="submit"
                    class="
                        rounded-md bg-neutral-900
                        px-4 py-2 text-sm font-medium text-white
                    "
            >
                댓글 수정
            </button>
        </div>
    </form>
</th:block>
