<!DOCTYPE html>
<html
    lang="ko"
    xmlns:th="http://www.thymeleaf.org"
>
<body>
<th:block th:fragment="playlistEditPostList(posts, playlistId)">
    <ul
        th:if="${!#lists.isEmpty(posts)}"
        class="
            max-h-[36rem] divide-y
            divide-neutral-200 overflow-y-auto
            px-6 py-4 md:px-10
        "
    >
        <li
            th:each="post : ${posts}"
            class="flex items-center gap-4 py-4"
        >
            <!-- 기본 이미지 -->
            <a
                th:href="@{/posts/{id}(id=${post.id})}"
                class="
                    flex size-16 shrink-0
                    justify-center rounded-2xl
                    border border-neutral-200
                    bg-white overflow-hidden
                "
            >
                <img
                    th:src="${post.thumbnailUrl}"
                    th:alt="|${post.title} 썸네일|"
                    onerror="
                        this.onerror = null;
                        this.src='/img/tuna-note-blurple.png'
                    "
                    class="size-full object-contain">
            </a>

            <!-- 노래 정보 -->
            <a
                th:href="@{/posts/{id}(id=${post.id})}"
                class="
                    min-w-0 flex-1 rounded-xl
                    border border-neutral-200
                    bg-white px-5 py-4
                    hover:bg-neutral-50
                "
            >
                <strong
                    th:text="${post.title}"
                    class="
                        block truncate
                        text-base font-semibold
                    "
                >
                    노래 이름
                </strong>

                <span
                    th:if="${post.musicUrl != null and !#strings.isEmpty(post.musicUrl)}"
                    th:text="${post.musicUrl}"
                    class="
                        mt-1 block truncate
                        text-xs text-neutral-500
                    "
                >
                    노래 링크
                </span>

                <span
                    th:if="${post.musicUrl == null or #strings.isEmpty(post.musicUrl)}"
                    class="mt-1 block text-xs text-neutral-400"
                >
                    등록된 노래 링크가 없습니다.
                </span>
            </a>

            <!-- 단일 삭제 -->
            <form
                th:action="@{/playlists/{playlistId}/posts/{postId}/delete(playlistId=${playlistId}, postId=${post.id})}"
                method="POST"
                onsubmit="return confirm('이 곡을 플레이리스트에서 제거하시겠습니까?');"
                class="shrink-0"
            >
                <button
                    type="submit"
                    class="
                        rounded-lg border border-red-200
                        bg-white px-3 py-2
                        text-sm font-medium text-red-600
                        hover:bg-red-50
                    "
                >
                    삭제
                </button>
            </form>

            <!-- 선택 체크박스 -->
            <input
                type="checkbox"
                name="postIds"
                th:value="${post.id}"
                th:attr="aria-label=|${post.title}선택|"
                form="selected-delete-form"
                data-playlist-item
                class="
                    size-5 shrink-0
                    accent-neutral-900
                "
            >
        </li>
    </ul>
    <!-- 빈 플레이리스트 -->
    <div
        th:if="${#lists.isEmpty(posts)}"
        class="
            flex min-h-80 flex-col
            items-center justify-center
            px-6 py-12 text-center
        "
    >
        <img
            th:src="@{/img/tuna-note-blurple.png}"
            alt=""
            class="size-20 object-contain opacity-40">

        <p class="mt-4 font-semibold">
            플레이리스트가 비어있습니다.
        </p>

        <p class="mt-1 text-sm text-neutral-500">
            게시글에서 원하는 곡을 추가해보세요.
        </p>

        <a
            th:href="@{/}"
            class="
                mt-5 rounded-lg bg-neutral-900
                px-4 py-2
                text-sm font-medium text-white
                hover:bg-neutral-700
            "
        >
            곡 둘러보기
        </a>
    </div>
</th:block>

</body>
</html>
