<!DOCTYPE html>
<html
    lang="ko"
    xmlns:th="http://www.thymeleaf.org"
>
<body>
<dialog
    id="playlist-add-dialog"
    th:fragment="playlistPopup"
    class="
        m-auto w-[calc(100% - 2rem)] max-w-2xl
        rounded-3xl border border-neutral-300
        bg-neutral-100 p-0 shadow-2xl
        backdrop:bg-black/50
    "
>
    <div class="min-h-96 p-8">
        <!-- 팝업 헤더 -->
        <header
            class="
                flex items-center justify-between gap-4
                border-b border-neutral-200
                px-5 py-5 sm:px-6
            ">
            <div class="flex min-w-0 items-center gap-3">
                <span class="
                    flex size-10 shrink-0
                    items-center justify-center
                    rounded-xl bg-neutral-900 text-white
                ">
                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="size-5"
                            aria-hidden="true"
                    >
                    <path d="M9 18V5l10-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="16" cy="16" r="3"/>
                </svg>
                </span>

                <div class="min-w-0">
                    <h2
                        id="playlist-add-title"
                        class="text-lg font-semibold tracking-tight"
                    >
                        플레이리스트 추가
                    </h2>

                    <p class="mt-0.5 text-sm text-neutral-500">
                        음악을 저장할 플레이리스트를 선택하세요.
                    </p>
                </div>
            </div>

            <button
                type="button"
                data-playlist-popup-close
                aria-label="팝업 닫기"
                class="
                    flex size-9 shrink-0
                    items-center justify-center
                    rounded-lg text-neutral-400
                    transition-colors
                    hover:bg-neutral-100
                    hover:text-neutral-900
                "
            >
                <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        class="size-5"
                        aria-hidden="true"
                >
                    <path d="m6 6 12 12"/>
                    <path d="m18 6-12 12"/>
                </svg>
            </button>
        </header>

        <!-- 플레이리스트 선택 -->
        <form
            th:action="@{/playlists/posts}"
            method="post"
            class="px-4 py-4 sm:px-5"
        >
            <input
                type="hidden"
                name="postId"
                data-selected-post-id
            >

            <button
                type="button"
                data-playlist-create-open
                class="
                    mb-4 flex w-full items-center
                    justify-center gap-2
                    rounded-xl border border-neutral-300
                    bg-white px-4 py-2.5
                    text-sm font-medium text-neutral-700
                    transition-colors
                    hover:bg-neutral-400
                    hover:bg-neutral-50
                    hover:text-neutral-950
                "
            >
                <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        class="size-4"
                        aria-hidden="true"
                >
                    <path d="M12 5v14"/>
                    <path d="M5 12h14"/>
                </svg>

                새 플레이리스트 만들기
            </button>

            <ul
                th:if="${playlists != null and !#lists.isEmpty(playlists)}"
                class="
                    flex max-h-[min(24rem,60vh)]
                    flex-col gap-2 overflow-y-auto pr-1
                "
            >
                <li th:each="playlist : ${playlists}">
                    <button
                        type="submit"
                        name="playlistId"
                        th:value="${playlist.id}"
                        class="
                            group flex w-full items-center gap-3
                            rounded-xl border border-neutral-200
                            bg-white px-4 py-3 text-left
                            transition-colors
                            hover:border-neutral-300
                            hover:bg-neutral-50
                    ">
                        <!-- 플레이리스트 아이콘 -->
                        <span class="
                            flex size-9 shrink-0
                            items-center justify-center
                            rounded-lg bg-neutral-100
                            text-neutral-500
                            transition-colors
                            group-hover:bg-neutral-200
                        ">
                            <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    class="size-4"
                                    aria-hidden="true"
                                >
                                <path d="M8 6h13"/>
                                <path d="M8 12h13"/>
                                <path d="M8 18h8"/>
                                <path d="M3 6h.01"/>
                                <path d="M3 12h.01"/>
                                <path d="M3 18h.01"/>
                            </svg>
                        </span>

                        <!-- 이름과 곡 수 -->
                        <span class="min-w-0 flex-1">
                            <span
                                class="
                                    block truncate text-sm
                                    font-medium text-neutral-900
                                "
                                th:text="${playlist.name}"
                            >
                                플레이리스트 이름
                            </span>

                            <span
                                class="
                                    mt-0.5 block text-xs
                                    text-neutral-500
                                "
                                th:text="|${playlist.postCount}곡|"
                            >
                                0곡
                            </span>
                        </span>
                    <!-- 추가 표시 -->
                        <span class="
                            flex size-8 shrink-0
                            items-center justify-center
                            rounded-lg text-neutral-400
                            transition-colors
                            group-hover:bg-neutral-900
                            group-hover:text-white
                        ">
                            <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    class="size-4"
                                    aria-hidden="true"
                            >
                                <path d="M12 5v14"/>
                                <path d="M5 12h14"/>
                            </svg>
                        </span>
                    </button>
                </li>
            </ul>

            <!-- 플레이리스트가 없을 때 -->
            <div
                th:if="${playlists == null or #lists.isEmpty(playlists)}"
                class="
                    flex flex-col items-center
                    rounded-xl border
                    border-dashed border-neutral-300
                    px-6 py-10 text-center
                "
            >
                <span class="
                    flex size-11 items-center
                    justify-center rounded-full
                    bg-neutral-100 text-neutral-500
                ">
                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            class="size-5"
                            aria-hidden="true"
                    >
                        <path d="M4 6h16"/>
                        <path d="M4 12h10"/>
                        <path d="M4 18h10"/>
                        <path d="M18 15v6"/>
                        <path d="M15 18h6"/>
                    </svg>
                </span>
                </div>
                <div th:if="${playlists == null or #lists.isEmpty(playlists)}"
                    class="
                        flex flex-col items-center
                        rounded-xl border border-dashed
                        border-neutral-300
                        px-6 py-10 text-center
                    "
                >
                    <strong class="mt-3 text-sm font-medium">
                        아직 플레이리스트가 없습니다.
                    </strong>
                </div>
        </form>
    </div>
</dialog>
</body>
