<!DOCTYPE html>
<html
    lang="ko"
    xmlns:th="http://www.thymeleaf.org"
>

<th:block th:fragment="youtubePlaylistPlayer(posts, playlistId)">
    <section
        hidden
        data-youtube-playlist
        th:attr="
            data-playlist-id=${playlistId},
            data-next-cursor=${youtubeSlice.nextCursor}
        "
        class="
            overflow-hidden rounded-lg
            border border-neutral-200
            bg-neutral-100
        "
    >
        <header class="border-b border-neutral-300 px-5 py-4">
            <h2 class="font-semibold">
                YouTube 연속 재생
            </h2>

            <p
                data-youtube-status
                class="mt-1 text-sm text-neutral-500"
            >
                재생목록을 준비하고 있습니다.
            </p>
        </header>

        <div class="aspect-video bg-black">
            <div
                data-youtube-player
                th:id="|youtube-player-${playlistId}|"
            ></div>
        </div>

        <div hidden data-youtube-sources>
            <span
                th:each="track : ${youtubeSlice.content}"
                th:attr="data-youtube-video-id=${track.videoId}"
            ></span>
        </div>
    </section>
</th:block>
</html>
