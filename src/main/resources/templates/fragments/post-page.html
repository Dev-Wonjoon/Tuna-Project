<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
>
<body>
<div th:fragment="postPage"
     data-post-page
     th:attr="data-next-cursor=${postNextCursor}">
    <th:block th:each="post : ${posts}">
        <th:block th:replace="~{fragments/post-card :: postCard(${post})}"/>
    </th:block>

</div>

</body>
</html>
