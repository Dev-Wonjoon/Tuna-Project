<!DOCTYPE html>
<html lang="ko"
        xmlns:th="https://www.thymeleaf.org"
        th:fragment="layout(title, content)"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Tuna</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-white text-neutral-900 antialiased">
<div class="
        min-h-screen
        md:grid
        md:grid-cols-[14rem_minmax(0,1fr)]
        lg:grid-cols-[16rem-minmax(0,1fr)]
">
    <aside class="
        border-b border-neutral-300 bg-white
        md:sticky md:top-0 md:h-screen
        md:overflow-y-auto
        md:border-b-0 md:border-r
    ">
        <th:block th:replace="~{fragments/nav :: nav}"/>
    </aside>

    <main class="
        flex min-h-screen min-w-0
        items-start justify-center
        px-4 py-6
        md:px-8 md:py-9
    ">
        <th:block th:replace="${content}"/>
    </main>

</div>

</body>
</html>
