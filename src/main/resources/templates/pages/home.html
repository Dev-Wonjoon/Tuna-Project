<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org" th:replace="~{layouts/base :: layout(
            'Tuna',
            ~{::section}
        )}">
<section class="flex w-full max-w-2xl flex-col gap-6">
    <script th:src="@{/js/search.js}" defer></script>

    <div data-post-pagination
         th:attr="
            data-next-cursor=${postNextCursor},
            data-page-size=${pageSize}
         "
    >
        <div data-post-list
             class="flex flex-col gap-6">
            <th:block th:each="post : ${posts}">
                <th:block th:replace="~{fragments/post-card :: postCard(${post})}"/>
            </th:block>
        </div>

        <!-- 가까워지면 다음 게시글 요청 -->
        <div data-post-sentinel
             class="min-h-1">
            <p hidden
               data-post-loading
               role="status"
               class="py-5 text-center text-sm text-neutral-500">
                다음 게시글을 불러오는 중입니다.
            </p>

            <button hidden
                    type="button"
                    data-post-error
                    class="
                        w-full py-5 text-center
                        text-sm text-red-500
                        hover:text-red-700
                    ">
                게시글을 불러오지 못했습니다. 다시 시도
            </button>
        </div>
    </div>

    <th:block th:replace="~{fragments/playlist-popup :: playlistPopup}"/>

    <p th:if="${#lists.isEmpty(posts)}" class="
            flex min-h-72 items-center justify-center
            border border-dashed border-neutral-300
            text-sm text-neutral-500
        ">
        게시글이 없습니다.
    </p>

    <button id="searchOpen"
            type="button"
            class="fixed right-8 top-8 z-40
                   flex size-14 items-center justify-center
                   rounded-full bg-neutral-900 text-white
                   shadow-lg hover:bg-neutral-700">

        <svg class="size-6"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
        </svg>
    </button>

    <div id="searchModal"
         class="fixed inset-0 z-50 hidden bg-black/30">

        <div class="absolute left-1/2 top-1/2
                    w-[calc(100%-2rem)] max-w-xl
                    -translate-x-1/2 -translate-y-1/2
                    rounded-xl bg-white p-6 shadow-xl">

            <button id="searchClose"
                    type="button"
                    class="absolute right-4 top-3 text-xl text-neutral-500">
                x
            </button>

            <form th:action="@{/search}"
                  method="get"
                  class="mt-4 flex flex-col gap-3 sm:flex-row">

                <select name="searchType"
                        class="h-11 rounded-lg border border-neutral-300
                               bg-white px-3 text-sm">
                    <option value="searchTitleContent">제목 + 내용</option>
                    <option value="searchTitle">제목</option>
                    <option value="searchContent">내용</option>
                    <option value="searchAuthor">글쓴이</option>
                </select>

                <input type="search"
                       name="keyword"
                       placeholder="검색어를 입력하세요"
                       class="h-11 min-w-0 flex-1 rounded-lg
                              border border-neutral-300 px-4 text-sm">

                <button type="submit"
                        class="h-11 rounded-lg bg-neutral-900
                               px-5 text-sm font-medium text-white
                               hover:bg-neutral-700">
                    검색
                </button>
            </form>
        </div>
    </div>

    <script
            th:if="${playlistAlert != null}"
            th:inline="javascript"
    >
        window.alert([[${playlistAlert}]])
    </script>

    <div th:if="${param.login}"
         id="loginToast"
         class="
        fixed top-5 right-5 z-50
        flex items-center gap-3
        rounded-xl
        border border-neutral-200
        bg-white
        px-5 py-3
        text-sm
        text-neutral-700
        shadow-lg
     ">

    <span class="
        flex h-6 w-6 items-center justify-center
        rounded-full
        bg-green-100
        text-green-600
        text-xs
        font-bold
    ">
        ✓
    </span>

        <span>
        로그인되었습니다.
    </span>

    </div>

    <div th:if="${param.logout}"
         id="logoutToast"
         class="
        fixed top-5 right-5 z-50
        flex items-center gap-3
        rounded-xl
        border border-neutral-200
        bg-white
        px-5 py-3
        text-sm
        text-neutral-700
        shadow-lg
     ">

    <span class="
        flex h-6 w-6 items-center justify-center
        rounded-full
        bg-red-100
        text-red-600
        text-xs
        font-bold
    ">
        ✓
    </span>

        <span>
        로그아웃되었습니다.
    </span>

    </div>

<script defer th:src="@{/js/post-infinite-scroll.js}"></script>
</section>
</html>
