<!DOCTYPE html>
<html lang="ko"
      xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(
        ${title},
        ~{::detail})}"
>
<body>
<article th:fragment="detail" class="
        min-h[289px] bg-neutral-200
        transition-colors hover:bg-neutral-300
    ">
    <a th:href="@{/posts/{id}(id=${post['id']})}" class="block min-h[280px] p-5">
        <h2 class="text-lg font-semibold" th:text="${post['title']}">
            게시글 제목
        </h2>

        <p class="mt-3 whitespace-pre-line text-sm text-neutral-600" th:text="${post['content']}">
            게시글 내용
        </p>
    </a>

    <div class="
            flex items-center border-t border-neutral-300
            px-5 py-3 text-sm text-neutral-500
        ">
        <div class="flex items-center gap-3">
            <button type="button" aria-label="플레이리스트에 추가" class="
                    flex size-7 items-center justify-center
                    rounded-md hover:bg-neutral-100
                    hover:text-neutral-950
                ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" class="size-4" aria-hidden="true">
                    <path d="M16 5H3" />
                    <path d="M11 12H3" />
                    <path d="M16 19H3" />
                    <path d="M18 9v6" />
                    <path d="M21 12h-6" />
                </svg>
            </button>
            <a th:href="@{/posts/{id}(id=${post['id']})} + '#comments'" aria-label="댓글 보기" class="
                    flex size-7 items-center justify-center
                    rounded-md hover:bg-neutral-100
                    hover:text-neutral-950
                ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" class="size-4" aria-hidden="true">
                    <path
                            d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
                    <path d="M8 12h.01" />
                    <path d="M12 12h.01" />
                    <path d="M16 12h.01" />
                </svg>
            </a>
        </div>
        <div class="ml-auto flex items-center gap-3">
            <span th:text="${post['authorEmail']}">
                작성자
            </span>

            <span>
                조회수
                <span th:text="${post['viewCount']}">0</span>
            </span>
        </div>
    </div>

    <section
            id="comments"
            class="mt-6 border-t border-neutral-300 px-5 py-5"
    >
        <h2 class="font-semibold">
            댓글
            <span th:text="|${#lists.size(comments)}개|">0개</span>
        </h2>

        <ul th:if="${!#lists.isEmpty(comments)}"
            class="mt-4 flex flex-col gap-4"
        >
            <li
                    th:each="comment : ${comments}"
                    class="border-b border-neutral-300 pb-4"
            >
                <div class="flex items-center justify-between">
                    <strong
                            class="text-sm"
                            th:text="${comment['authorEmail']}"
                    >
                        작성자
                    </strong>

                    <time
                            class="text-xs text-neutral-500"
                            th:text="${comment['createdAt']}"
                    >
                        작성일
                    </time>
                </div>

                <p
                        class="mt-2 whitespace-pre-line text-sm"
                        th:text="${comment['content']}"
                >
                    댓글 내용
                </p>
            </li>
        </ul>

        <p
                th:if="${#lists.isEmpty(comments)}"
                class="py-8 text-center text-sm text-neutral-500"
        >
            아직 댓글이 없습니다.
        </p>
    </section>
</article>
</body>
</html>
