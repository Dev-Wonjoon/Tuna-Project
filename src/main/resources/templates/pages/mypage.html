<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('마이페이지 | Tuna', ~{::section})}">



<section class="w-full max-w-6xl">

    <!-- 프로필 -->
    <div class="
        overflow-hidden rounded-xl
        border border-neutral-200
        bg-white shadow-sm
    ">
        <div class="flex items-center justify-between border-b border-neutral-200 px-6 py-4">

            <div>
                <h1 class="text-lg font-bold">
                    마이페이지
                </h1>

                <p class="mt-0.5 text-xs text-neutral-500">
                    회원 정보를 확인할 수 있습니다.
                </p>
            </div>

            <form
                    th:action="@{/members/delete}"
                    method="post"
                    onsubmit="return confirm('정말 회원탈퇴 하시겠습니까?');"
            >
                <button
                        type="submit"
                        class="
                rounded-md
                bg-red-600
                px-3 py-1.5
                text-xs font-medium
                text-white
                hover:bg-red-700
            "
                >
                    회원탈퇴
                </button>
            </form>

        </div>

        <div class="flex items-center gap-6 p-5">

            <!-- 프로필 이미지 -->
            <div class="
            h-16 w-16 shrink-0
            overflow-hidden
            rounded-full
            bg-neutral-200
            ">
                <img
                        th:src="${member.imageUrl}"
                        class="h-full w-full object-cover"
                        alt="프로필 이미지"
                >
            </div>

            <!-- 회원 정보 -->
            <div class="flex flex-1 flex-wrap items-center gap-x-8 gap-y-2">

                <div>
                    <p class="text-xs text-neutral-500">
                        이메일
                    </p>

                    <p class="text-sm"
                       th:text="${member.email}">
                        user@test.com
                    </p>
                </div>

                <div>
                    <p class="text-xs text-neutral-500">
                        이름
                    </p>

                    <p class="text-sm"
                       th:text="${member.name}">
                        user@test.com
                    </p>
                </div>

                <!-- 가입일 -->
                <div>
                    <p class="text-xs text-neutral-500">
                        가입일
                    </p>

                    <p class="text-sm"
                       th:text="${#temporals.format(member.createdAt,'yyyy-MM-dd')}">
                        2026-07-29
                    </p>
                </div>

                <!-- 작성한 게시글 -->
                <div>
                    <p class="text-xs text-neutral-500">
                        작성한 게시글
                    </p>

                    <p class="text-sm font-semibold"
                       th:text="${posts.size()}">
                        0
                    </p>
                </div>

                <!-- 권한 -->
                <div>
                    <p class="text-xs text-neutral-500">
                        권한
                    </p>

                    <p class="text-sm font-semibold"
                       th:text="${member.role == 'ADMIN' ? '관리자' : '일반'}">
                        일반
                    </p>
                </div>

            </div>

        </div>

    </div>

    <!-- 게시글 -->
    <div class="mt-10">

        <div class="mb-6 flex items-center justify-between">

            <h2 class="text-2xl font-semibold">
                내가 작성한 게시글
            </h2>

            <span class="text-sm text-neutral-500"
                  th:text="'총 ' + ${posts.size()} + '개'">
                총 0개
            </span>

        </div>

        <!-- 게시글 없을 때 -->
        <div
                th:if="${#lists.isEmpty(posts)}"
                class="
                rounded-xl
                border border-dashed border-neutral-300
                py-20
                text-center
                text-neutral-500
            "
        >
            아직 작성한 게시글이 없습니다.
        </div>

        <!-- 게시글 목록 -->
        <div
                th:unless="${#lists.isEmpty(posts)}"
                class="grid grid-cols-6 gap-4"
        >

            <a
                    th:each="post : ${posts}"
                    th:href="@{/posts/{id}(id=${post.id})}"
                    class="
                    overflow-hidden
                    rounded-xl
                    border border-neutral-200
                    bg-white
                    shadow-sm
                    transition
                    hover:-translate-y-1
                    hover:shadow-lg
                "
            >

                <div class="
                    flex aspect-square
                    items-center justify-center
                    bg-neutral-100
                    text-neutral-400
                ">
                    <img
                            th:src="${post.thumbnailUrl}"
                            class="aspect-square w-full object-cover"
                    >
                </div>

                <div class="p-3">

                    <h3
                            class="truncate text-sm font-semibold"
                            th:text="${post.title}">
                        게시글 제목
                    </h3>

                    <p
                            class="mt-1 line-clamp-2 text-xs text-neutral-500"
                            th:text="${post.content}">
                        게시글 내용
                    </p>

                    <p
                            class="mt-2 text-xs text-neutral-400"
                            th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd')}">
                        2026-07-29
                    </p>

                </div>

            </a>

        </div>

    </div>

</section>


</html>
