<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('플레이리스트 만들기 | Tuna', ~{::section})}"
>
<section class="w-full max-w-2xl">
    <div class="
        overflow-hidden rounded-lg
        border border-neutral-200
        bg-neutral-100
    ">
        <header class="border-b border-neutral-300 px-6 py-5">
            <h1 class="text-xl font-semibold">
                새 플레이리스트
            </h1>

            <p class="mt-1 text-sm text-neutral-500">
                게시글을 모아둘 플레이리스트를 만들어보세요.
            </p>
        </header>

        <form
            th:action="@{/playlists/new}"
            method="POST"
            class="p-6"
        >
            <div>
                <label
                    for="name"
                    class="text-sm font-medium"
                >
                    플레이리스트 이름
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    maxlength="255"
                    required
                    autocomplete="off"
                    placeholder="플레이리스트 이름을 입력하세요."
                    class="
                        mt-2 w-full rounded-md
                        border border-neutral-300 bg-white
                        px-3 py-2
                        placeholder:text-neutral-400
                        focus:border-neutral-900
                        focus:outline-none
                    "
                >

                <p class="mt-2 text-xs text-neutral-500">
                    같은 이름의 플레이리스트는 중복해서 만들 수 없습니다.
                </p>
            </div>

            <div class="
                mt-6 flex items-center justify-end gap-3
                border-t border-neutral-300 pt-5
            ">
                <a
                    th:href="@{/}"
                    class="
                        rounded-md border border-neutral-300
                        bg-white px-4 py-2
                        text-sm font-medium
                        hover:bg-neutral-50
                    "
                >
                    취소
                </a>

                <button
                    type="submit"
                    class="
                        rounded-md bg-neutral-900
                        px-4 py-2
                        text-sm font-medium text-white
                        hover:bg-neutral-700
                        focus-visible:outline-2
                        focus-visible:outline-offset-2
                        focus-visible:outline-neutral-900
                    "
                >
                    만들기
                </button>
            </div>
        </form>

    </div>
</section>

</html>
