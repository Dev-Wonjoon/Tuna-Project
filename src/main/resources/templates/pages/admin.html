<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('회원 관리 | Tuna', ~{::section})}">

<section class="w-full max-w-6xl">

    <!-- 헤더 -->
    <div class="overflow-hidden rounded-xl border border-neutral-200 bg-white shadow-sm">

        <div class="flex items-center justify-between border-b border-neutral-200 px-6 py-4">

            <div>
                <h1 class="text-lg font-bold">
                    회원 관리
                </h1>

                <p class="mt-1 text-xs text-neutral-500">
                    가입한 회원을 조회하고 관리할 수 있습니다.
                </p>
            </div>

            <span class="rounded-md bg-neutral-100 px-3 py-1 text-sm text-neutral-600"
                  th:text="'총 ' + ${members.size()} + '명'">
                총 0명
            </span>

        </div>

        <!-- 회원 목록 -->
        <div class="overflow-x-auto">

            <table class="min-w-full">

                <thead class="border-b border-neutral-200 bg-neutral-50">

                <tr class="text-sm text-neutral-600">

                    <th class="px-6 py-3 text-left">
                        닉네임
                    </th>

                    <th class="px-6 py-3 text-left">
                        이메일
                    </th>

                    <th class="px-6 py-3 text-center">
                        권한
                    </th>

                    <th class="px-6 py-3 text-center">
                        가입일
                    </th>

                    <th class="px-6 py-3 text-center">
                        게시글 수
                    </th>

                    <th class="px-6 py-3 text-center">
                        관리
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr
                        th:each="member : ${members}"
                        class="border-b border-neutral-100 hover:bg-neutral-50">

                    <td class="px-6 py-4"
                        th:text="${member.name}">
                        홍길동
                    </td>

                    <td class="px-6 py-4"
                        th:text="${member.email}">
                        test@test.com
                    </td>

                    <td class="px-6 py-4 text-center">

                        <span
                                th:text="${member.role.name() == 'ADMIN' ? '관리자' : '일반'}"
                                class="rounded-full bg-neutral-100 px-3 py-1 text-xs">
                            일반
                        </span>

                    </td>

                    <td class="px-6 py-4 text-center"
                        th:text="${#temporals.format(member.createdAt,'yyyy-MM-dd')}">
                        2026-07-30
                    </td>

                    <td class="px-6 py-4 text-center"
                        th:text="${member.postCount}">
                        3
                    </td>

                    <td class="px-6 py-4">

                        <div class="flex justify-center gap-2">

                            <button
                                    type="button"
                                    th:attr="data-id=${member.id},data-name=${member.name},data-role=${member.role}"
                                    onclick="openEditModal(this)"
                                    class="rounded-md border border-neutral-300 px-3 py-1.5 text-sm hover:bg-neutral-100">
                                회원수정
                            </button>

                            <form
                                    th:action="@{/admin/members/{id}/delete(id=${member.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        onclick="return confirm('정말 탈퇴시키겠습니까?')"
                                        class="rounded-md bg-red-500 px-3 py-1.5 text-sm text-white hover:bg-red-600">
                                    회원탈퇴
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                <!-- 회원이 없을 경우 -->

                <tr th:if="${#lists.isEmpty(members)}">

                    <td colspan="6"
                        class="py-16 text-center text-neutral-500">

                        가입한 회원이 없습니다.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- 회원 수정 모달 -->
    <div id="editModal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">

        <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">

            <h2 class="text-lg font-bold">
                회원 권한 수정
            </h2>

            <p class="mt-2 text-sm text-neutral-500">
                <span id="memberName"></span> 회원의 권한을 변경합니다.
            </p>

            <form th:action="@{/admin/update-role}" method="post">

                <input type="hidden" id="memberId" name="id">

                <div class="mt-5">

                    <label class="mb-2 block text-sm font-medium">
                        권한
                    </label>

                    <select
                            id="memberRole"
                            name="role"
                            class="w-full rounded-md border border-neutral-300 px-3 py-2">

                        <option value="USER">일반</option>
                        <option value="ADMIN">관리자</option>

                    </select>

                </div>

                <div class="mt-6 flex justify-end gap-2">

                    <button
                            type="button"
                            onclick="closeEditModal()"
                            class="rounded-md border border-neutral-300 px-4 py-2 hover:bg-neutral-100">

                        취소

                    </button>

                    <button
                            type="submit"
                            class="rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">

                        저장

                    </button>

                </div>

            </form>

        </div>

    </div>
    <script>
        function openEditModal(button) {

            document.getElementById("memberId").value = button.dataset.id;
            document.getElementById("memberName").textContent = button.dataset.name;
            document.getElementById("memberRole").value = button.dataset.role;

            const modal = document.getElementById("editModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeEditModal() {

            const modal = document.getElementById("editModal");
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        }
    </script>
</section>


</html>
