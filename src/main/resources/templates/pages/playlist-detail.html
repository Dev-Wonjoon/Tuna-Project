<!DOCTYPE html>
<html
    lang="ko"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/base :: layout(${title}, ~{::section})}"
>
<section class="flex w-full max-w-2xl flex-col gap-6">
    <header class="
        rounded-lg border border-neutral-200
        bg-neutral-100 px-6 py-5
    ">
        <p class="text-xs font-medium text-neutral-500">
            플레이리스트
        </p>

        <div class="mt-1 flex items-end justify-between gap-4">
            <h1
                class="text-2xl font-semibold"
                th:text="${playlist['name']}"
            >
                플레이리스트 이름
            </h1>

            <span
                class="shrink-0 text-sm text-neutral-500"
                th:text="|${#lists.size(posts)}곡|"
            >
                0곡
            </span>

            <a
                th:href="@{/playlists/{id}/edit(id=${playlist.id})}"
                class="
                    rounded-md border border-neutral-300
                    bg-white px-3 py-1.5
                    text-sm font-medium
                    hover:bg-neutral-50
                "
            >
                수정
            </a>

            <form
                th:action="@{/playlists/{id}/delete(id=${playlist['id']})}"
                method="POST"
            >
                <button
                    type="submit"
                    onclick="return confirm('플레이리스트를 삭제하시겠습니까?');"
                    class="
                        rounded-md border border-red-200
                        bg-white px-3 py-1.5
                        text-sm font-medium text-red-600
                        hover:bg-red-50
                    "
                >
                    삭제
                </button>
            </form>
        </div>
    </header>

    <th:block th:if="${!#lists.isEmpty(youtubeSlice.content}"
              th:replace="~{fragments/youtube-playlist-player :: youtubePlaylistPlayer(${youtubeSlice}, ${playlist.id})}"/>

    <th:block th:each="post : ${posts}">
        <th:block th:replace="~{fragments/post-card :: postCard(${post})}"/>
    </th:block>

    <p
        th:if="${#lists.isEmpty(posts)}"
        class="
            flex min-h-72 items-center justify-center
            rounded-lg border border-dashed border-neutral-300
            text-sm text-neutral-500
        "
    >
        이 플레이리스트에 담긴 게시글이 없습니다.
    </p>
<script defer th:src="@{/js/youtube-playlist-player.js}"></script>
</section>
</html>
