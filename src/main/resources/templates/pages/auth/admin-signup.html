<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout('관리자 계정 생성 | Tuna', ~{::section})}"
>
<body>

<section
    class="
        w-full max-w-sm
        rounded-xl border border-neutral-200
        bg-white p-8 shadow-sm
    "
>
    <a
        th:href="@{/}"
        class="text-2xl font-semibold"
    >
        Tuna
    </a>

    <h1 class="mt-8 text-xl font-semibold">
        관리자 계정 생성
    </h1>

    <form
        th:action="@{/admin/signup}"
        method="POST"
        class="mt-6 flex flex-col gap-5"
        th:object="${signUpForm}"
    >
        <div>
            <label for="email" class="text-sm font-medium">
                이메일
            </label>

            <input
                th:field="*{email}"
                type="email"
                autocomplete="email"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
                placeholder="5 ~ 50자"
            >
            <div
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
            <div
                    th:unless="${#fields.hasErrors('email')}"
                    class="mt-1 text-sm text-gray-500 leading-5">
                [아이디]@[사이트].[도메인] 형식으로<br>
                영문, 숫자, '@', '.' 만 사용해야 합니다.
            </div>
        </div>
        <div>
            <label for="name" class="text-sm font-medium">
                닉네임
            </label>

            <input
                    th:field="*{name}"
                    type="text"
                    required
                    class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
                    placeholder="2 ~ 10자"
            >
            <div
                    th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
            <div
                    th:unless="${#fields.hasErrors('name')}"
                    class="mt-1 text-sm text-gray-500 leading-5">
                한글, 영문, 숫자만 사용 가능합니다.
            </div>
        </div>
        <div>
            <label for="password" class="text-sm font-medium">
                비밀번호
            </label>
            <input
                th:field="*{password}"
                type="password"
                autocomplete="new-password"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
                placeholder="8 ~ 50자"
            >
            <div
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
        </div>

        <div>
            <label for="passwordConfirm" class="text-sm font-medium">
                비밀번호 확인
            </label>

            <input
                th:field="*{passwordConfirm}"
                type="password"
                autocomplete="new-password"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
                placeholder="8 ~ 50자"
            >

            <div
                th:if="${#fields.hasErrors('passwordConfirm')}"
                th:errors="*{passwordConfirm}"
                class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
            <div
                    th:unless="${#fields.hasErrors('passwordConfirm')}"
                    class="mt-1 text-sm text-gray-500 leading-5">
                비밀번호와 같아야 합니다.
            </div>
        </div>

        <button
            type="submit"
            class="
                rounded-md bg-neutral-900
                px-4 py-2.5
                font-medium text-white
                hover:bg-neutral-700
            "
        >
            계정 생성
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500">
        이미 계정이 있으신가요?

        <a
            th:href="@{/login}"
            class="font-medium text-neutral-900 hover:underline"
        >
            로그인
        </a>
    </p>
</section>

</body>
</html>
