<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout('회원가입 | Tuna', ~{::section})}"
>
<body>

<section
    class="
        w-full max-w-sm
        rounded-xl border border-neutral-200
        bg-white p-8 shadow-sm
    "
>
    <a
        th:href="@{/}"
        class="text-2xl font-semibold"
    >
        Tuna
    </a>

    <h1 class="mt-8 text-xl font-semibold">
        회원가입
    </h1>

    <form
        th:action="@{/signup}"
        method="POST"
        class="mt-6 flex flex-col gap-5"
        th:object="${signUpForm}"
    >
        <div>
            <label for="email" class="text-sm font-medium">
                이메일
            </label>

            <input
                th:field="*{email}"
                type="email"
                autocomplete="email"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
            >
            <div
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
        </div>
        <div>
            <label for="name" class="text-sm font-medium">
                닉네임
            </label>

            <input
                    th:field="*{name}"
                    type="text"
                    required
                    class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
            >
            <div
                    th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
        </div>
        <div>
            <label for="password" class="text-sm font-medium">
                비밀번호
            </label>
            <input
                th:field="*{password}"
                type="password"
                autocomplete="new-password"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
            >
            <div
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                    class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
        </div>

        <div>
            <label for="passwordConfirm" class="text-sm font-medium">
                비밀번호 확인
            </label>

            <input
                th:field="*{passwordConfirm}"
                type="password"
                autocomplete="new-password"
                required
                class="
                    mt-2 w-full rounded-md border
                    border-neutral-300 px-3 py-2
                "
            >

            <div
                th:if="${#fields.hasErrors('passwordConfirm')}"
                th:errors="*{passwordConfirm}"
                class="text-sm text-red-500 text-red-600 mt-1"
            >
                에러메세지
            </div>
        </div>

        <button
            type="submit"
            class="
                rounded-md bg-neutral-900
                px-4 py-2.5
                font-medium text-white
                hover:bg-neutral-700
            "
        >
            가입하기
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500">
        이미 계정이 있으신가요?

        <a
            th:href="@{/login}"
            class="font-medium text-neutral-900 hover:underline"
        >
            로그인
        </a>
    </p>
</section>

</body>
</html>
